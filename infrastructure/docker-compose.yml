version: '3.9'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./mssql_init:/var/opt/mssql/backup 
    entrypoint: /bin/sh /var/opt/mssql/backup/entrypoint.sh
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 15
    

  cookifyapi:
    build:
      context: ../backend/CookifyAPI/CookifyAPI
      dockerfile: Dockerfile
    container_name: cookify_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Включаем поддержку HTTPS
      - ASPNETCORE_URLS=https://+
      # Настройки сертификата для Kestrel
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      # Настройка строки подключения
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=CookifyDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      - AuthSettings__Key=${JWT_KEY}
      
      - EmailSettings__Password=${SMTP_PASSWORD}
      - EmailSettings__SenderEmail=${SENDER_EMAIL}
      
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET} 
    ports:
      - "5022:443"
    volumes:
      - ./dev-certs:/https:ro

volumes:
  mssql_data: