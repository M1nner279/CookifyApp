name: Build and Realease android apk

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Build apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # flutter-version: '3.19.0'

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Run build_runner (Generate code)
        working-directory: ./frontend
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build apk
        working-directory: ./frontend
        run: flutter build apk --split-per-abi

      - name: Rename APK files
        working-directory: ./frontend
        run: |
          cd build/app/outputs/flutter-apk/
          
          APP_NAME="Cookify"
               
          # тут лежит версия
          VERSION="${{ github.event.release.tag_name }}" 
          
          # Переименовываем каждый файл
          mv app-armeabi-v7a-release.apk $APP_NAME-$VERSION-armeabi.apk
          mv app-arm64-v8a-release.apk $APP_NAME-$VERSION-arm64.apk
          mv app-x86_64-release.apk $APP_NAME-$VERSION-x86.apk

      # Автоматически создаем Релиз в GitHub и прикрепляем туда наши переименованные APK
      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/*-armeabi.apk
            frontend/build/app/outputs/flutter-apk/*-arm64.apk
            frontend/build/app/outputs/flutter-apk/*-x86.apk
